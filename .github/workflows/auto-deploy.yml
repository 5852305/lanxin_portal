# .github/workflows/auto-deploy.yml

name: auto deploy 🚀

on:
  # 仅当 push 到 master 分支时触发
  push:
    branches:
      - master
  # 允许在 GitHub Actions 页面手动点击触发
  workflow_dispatch:

# 并发控制：若有新的提交，自动取消排队或执行中的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 pnpm（自动适配 package.json 声明的版本）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # 3. 配置 Node.js 环境并启用 pnpm 缓存
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      # 4. 安装依赖
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 5. 打包构建
      - name: 打包 🔧
        run: pnpm run build

      # 6. 打包构建产物（将根目录 .output 下的内容打进压缩包）
      - name: 打包压缩包 🔧
        run: tar -zcvf nuxt.tar.gz -C .output .

      # 7. 上传压缩包至服务器
      - name: 上传压缩包至服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "nuxt.tar.gz"
          target: ${{ secrets.SERVER_DESTINATION }}

      # 8. 服务器解压并重启 Docker 服务
      - name: 服务器解压并重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            cd ${{ secrets.SERVER_DESTINATION }}
            tar -zxvf nuxt.tar.gz -C ./
            rm -f nuxt.tar.gz
            docker compose -f ${{ secrets.DOCKER_FILE }} down
            docker compose -f ${{ secrets.DOCKER_FILE }} up -d

